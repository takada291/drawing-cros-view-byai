<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI横断</title>
    
    <!-- GA4 Script -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WXBP6CPKLP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-WXBP6CPKLP');
    </script>

    <script type="importmap">
      {
        "imports": {
          "@google/generative-ai": "https://esm.run/@google/generative-ai"
        }
      }
    </script>
    <style>
        :root {
            --primary: #2c3e50;
            --bg-color: #f8f9fa;
            --accent: #27ae60;
            --pink: #e84393;
            --gray: #95a5a6;
            --error-bg: #ffe6e6;
            --success-bg: #e6ffe6;
        }
        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            margin: 0; padding: 20px; line-height: 1.6;
        }
        h1 {
            color: var(--primary);
            text-align: center;
            border-bottom: 3px solid var(--accent);
            padding-bottom: 10px;
        }
        .container {
            max-width: 900px; margin: 0 auto;
            background: white; padding: 20px;
            border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .input-group { margin-bottom: 15px; }
        label {
            display: block; font-weight: bold; margin-bottom: 5px;
            color: var(--primary); font-size: 0.9rem;
        }
        input[type="password"], input[type="file"], select {
            width: 100%; padding: 10px; border: 1px solid #ccc;
            border-radius: 4px; box-sizing: border-box;
        }
        .btn-run, .btn-dxf {
            width: 100%; padding: 15px; background-color: var(--accent);
            color: white; border: none; border-radius: 4px;
            font-size: 1.2rem; font-weight: bold; cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        .btn-run:hover { background-color: #1e8449; }
        .btn-dxf { background-color: #2980b9; }
        .btn-dxf:hover { background-color: #1c5980; }
        .btn-run:disabled { background-color: #ccc; cursor: not-allowed; }
        
        .api-note {
            font-size: 0.8rem; color: #666; background: #eee;
            padding: 10px; border-radius: 4px; margin-bottom: 20px;
        }
        #loading-msg {
            text-align: center; font-weight: bold; color: var(--accent);
            display: none; margin-top: 20px;
        }
        #result-area { display: none; margin-top: 30px; }
        
        #svg-area {
            margin-bottom: 20px;
            text-align: center;
            overflow-x: auto;
        }
        #svg-area svg {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            background-color: #fafafa;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }

        table {
            width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem;
        }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: var(--primary); color: white; }
        
        .editable-input {
            width: 100%; min-width: 60px; padding: 6px;
            border: 1px solid #ccc; border-radius: 4px;
            text-align: right; font-family: inherit;
            font-size: 0.95rem; background-color: #fff;
            box-sizing: border-box;
        }
        .editable-input.edited {
            background-color: #fff3cd; border-color: #ffeeba; color: #856404;
        }
        .add-row-btn, .del-row-btn {
            padding: 4px 8px; cursor: pointer; border: none; border-radius: 4px; color: white;
        }
        .add-row-btn { background-color: #3498db; }
        .del-row-btn { background-color: #e74c3c; }
        
        .station-header {
            background-color: #e8f4f8;
            padding: 10px;
            margin-top: 20px;
            border-left: 4px solid #3498db;
            font-weight: bold;
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .station-name-input {
            font-size: 1.1rem;
            font-weight: bold;
            padding: 4px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI横断 v0.9</h1>
        
        <div class="api-note">
            <strong>APIキー設定（初回のみ）</strong><br>
            ブラウザに保存されるため、次回以降の入力は不要です。
        </div>
        <div class="input-group">
            <input type="password" id="api-key" placeholder="Google Gemini APIキーを入力">
        </div>

        <div class="input-group">
            <label>ポール横断野帳の画像を選択</label>
            <input type="file" id="image-upload" accept="image/*" multiple>
            <p style="font-size: 0.8rem; color: #666; margin-top: 5px;">※階段状の図の画像をアップロードしてください。下段（縦:dy）の数値には「⊕(下り)」「⊖(上り)」「±0(水平)」を明記してください。</p>
        </div>
        
        <button class="btn-run" id="btn-run">AIで野帳を読み取る</button>
        
        <div id="loading-msg">
            ⏳ AIが野帳の段差寸法を読み取り中です...<br>
            <span style="font-size: 0.8rem; color:#666;" id="loading-detail">※手書き文字と符号を解析しています</span>
        </div>

        <div id="result-area">
            <h2 style="color: var(--primary); border-bottom: 2px solid #ccc; padding-bottom: 5px;">解析結果プレビュー</h2>
            <p style="font-size: 0.85rem; color: #666;">
                数値を修正すると図形が自動更新されます。<br>
                <span style="color: var(--pink); font-weight: bold;">桃色の線（地表面）</span>がDXF化されます。（灰色の破線は補助線です）
            </p>

            <div class="input-group" style="margin-top: 15px;">
                <label>DXF出力時の縮尺 1/</label>
                <!-- リストから選択も、直接の数値入力も可能にする -->
                <input type="number" id="export-scale" value="100" min="1" step="1" style="width: 120px; display: inline-block;" list="scale-options">
                <datalist id="scale-options">
                    <option value="50">
                    <option value="100">
                    <option value="200">
                    <option value="250">
                    <option value="500">
                </datalist>
                <p style="font-size: 0.8rem; color: #666; margin-top: 5px;">※横断面図アプリ等に読み込む際の縮尺に合わせて任意に入力できます。</p>
            </div>
            
            <div id="stations-container"></div>
            
            <button class="btn-dxf" id="btn-dxf" style="margin-top: 30px;">桃色の線をDXFで一括保存</button>
        </div>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "@google/generative-ai";

        const btn = document.getElementById('btn-run');
        const loading = document.getElementById('loading-msg');
        const loadingDetail = document.getElementById('loading-detail');
        const resultArea = document.getElementById('result-area');
        const apiKeyInput = document.getElementById('api-key');
        const imageInput = document.getElementById('image-upload');
        const stationsContainer = document.getElementById('stations-container');
        const btnDxf = document.getElementById('btn-dxf');
        const exportScaleInput = document.getElementById('export-scale');

        let parsedData = []; 

        const savedKey = localStorage.getItem('gemini_api_key_gnss');
        if(savedKey) apiKeyInput.value = savedKey;

        let audioCtx = null; 
        function unlockAudio() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            gain.gain.value = 0;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(0);
            osc.stop(audioCtx.currentTime + 0.01);
        }

        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (type === 'success') {
                [0, 0.2].forEach(delay => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.type = 'sine';
                    osc.frequency.value = 800; 
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime + delay);
                    osc.start(audioCtx.currentTime + delay);
                    osc.stop(audioCtx.currentTime + delay + 0.1);
                });
            } else if (type === 'error') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sawtooth';
                osc.frequency.value = 150; 
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.5);
            }
        }

        async function findAvailableModel(apiKey) {
            try {
                loadingDetail.innerText = "最適なAIモデルを探しています...";
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`); 
                if (!response.ok) return "gemini-1.5-pro"; 
                const data = await response.json(); 
                const models = data.models || []; 
                const capableModels = models.filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes("generateContent")); 
                let bestModel = capableModels.find(m => m.name === "models/gemini-1.5-pro"); 
                if (!bestModel) bestModel = capableModels.find(m => m.name === "models/gemini-2.5-flash"); 
                if (!bestModel) bestModel = capableModels.find(m => m.name === "models/gemini-1.5-flash"); 
                if (bestModel) return bestModel.name.replace("models/", ""); 
                return "gemini-1.5-pro"; 
            } catch (e) { 
                return "gemini-1.5-pro"; 
            } 
        } 
        
        async function fileToGenerativePart(file) { 
            return new Promise((resolve) => { 
                const reader = new FileReader(); 
                reader.onloadend = () => { 
                    resolve({ inlineData: { data: reader.result.split(',')[1], mimeType: file.type } }); 
                }; 
                reader.readAsDataURL(file); 
            }); 
        } 

        function renderAll() {
            stationsContainer.innerHTML = '';
            parsedData.forEach((station, stationIndex) => {
                const wrapper = document.createElement('div');
                wrapper.style.marginBottom = "40px";
                
                const header = document.createElement('div');
                header.className = 'station-header';
                header.innerHTML = `
                    <div>
                        測点名: <input type="text" class="station-name-input" data-sidx="${stationIndex}" value="${station.stationName}">
                    </div>
                `;
                wrapper.appendChild(header);
                
                const svgDiv = document.createElement('div');
                svgDiv.id = `svg-area-${stationIndex}`;
                svgDiv.style.textAlign = 'center';
                svgDiv.style.marginBottom = '10px';
                wrapper.appendChild(svgDiv);
                
                const table = document.createElement('table');
                table.innerHTML = `
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>横 (dx) m</th>
                            <th>縦 (dy) m<br><span style="font-size:0.7rem; font-weight:normal;">※下りが正(+)、上りが負(-)</span></th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                `;
                const tbody = table.querySelector('tbody');
                
                station.segments.forEach((seg, segIndex) => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${segIndex + 1}</td>
                        <td><input type="number" step="0.01" class="editable-input" data-sidx="${stationIndex}" data-segidx="${segIndex}" data-field="dx" value="${seg.dx}"></td>
                        <td><input type="number" step="0.01" class="editable-input" data-sidx="${stationIndex}" data-segidx="${segIndex}" data-field="dy" value="${seg.dy}"></td>
                        <td>
                            <button class="add-row-btn" data-sidx="${stationIndex}" data-segidx="${segIndex}">＋</button>
                            <button class="del-row-btn" data-sidx="${stationIndex}" data-segidx="${segIndex}">－</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
                wrapper.appendChild(table);
                stationsContainer.appendChild(wrapper);
                
                drawSVG(station, svgDiv.id);
            });
            
            attachEvents();
        }

        function drawSVG(station, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            
            let groundPts = [{x: 0, y: 0}];
            let stairPts = [{x: 0, y: 0}];
            let curX = 0;
            let curY = 0;
            
            station.segments.forEach((seg) => {
                let dx = parseFloat(seg.dx) || 0;
                let dy = parseFloat(seg.dy) || 0;
                
                stairPts.push({x: curX + dx, y: curY});
                stairPts.push({x: curX + dx, y: curY + dy});
                
                curX += dx;
                curY += dy;
                groundPts.push({x: curX, y: curY});
            });
            
            if(groundPts.length < 2) return;

            let minX = Math.min(...stairPts.map(p => p.x));
            let maxX = Math.max(...stairPts.map(p => p.x));
            let minY = Math.min(...stairPts.map(p => p.y));
            let maxY = Math.max(...stairPts.map(p => p.y));
            
            let spanX = (maxX - minX) || 1;
            let spanY = (maxY - minY) || 1;
            
            const svgW = 600;
            const svgH = 400;
            const padding = 40;
            
            let scale = Math.min((svgW - padding * 2) / spanX, (svgH - padding * 2) / spanY);
            
            let offsetX = (svgW - spanX * scale) / 2 - minX * scale;
            let offsetY = (svgH - spanY * scale) / 2 - minY * scale;
            
            const ns = 'http://www.w3.org/2000/svg';
            const svg = document.createElementNS(ns, 'svg');
            svg.setAttribute('viewBox', `0 0 ${svgW} ${svgH}`);
            svg.setAttribute('width', '100%');
            svg.setAttribute('style', 'max-width: 600px;');
            
            let stairPathD = stairPts.map((p, i) => {
                let px = p.x * scale + offsetX;
                let py = p.y * scale + offsetY;
                return `${i === 0 ? 'M' : 'L'}${px},${py}`;
            }).join(' ');
            
            const stairPath = document.createElementNS(ns, 'path');
            stairPath.setAttribute('d', stairPathD);
            stairPath.setAttribute('fill', 'none');
            stairPath.setAttribute('stroke', 'var(--gray)');
            stairPath.setAttribute('stroke-width', '2');
            stairPath.setAttribute('stroke-dasharray', '4 4');
            svg.appendChild(stairPath);

            let groundPathD = groundPts.map((p, i) => {
                let px = p.x * scale + offsetX;
                let py = p.y * scale + offsetY;
                return `${i === 0 ? 'M' : 'L'}${px},${py}`;
            }).join(' ');
            
            const groundPath = document.createElementNS(ns, 'path');
            groundPath.setAttribute('d', groundPathD);
            groundPath.setAttribute('fill', 'none');
            groundPath.setAttribute('stroke', 'var(--pink)');
            groundPath.setAttribute('stroke-width', '4');
            groundPath.setAttribute('stroke-linejoin', 'round');
            svg.appendChild(groundPath);
            
            const startCircle = document.createElementNS(ns, 'circle');
            startCircle.setAttribute('cx', groundPts[0].x * scale + offsetX);
            startCircle.setAttribute('cy', groundPts[0].y * scale + offsetY);
            startCircle.setAttribute('r', '5');
            startCircle.setAttribute('fill', '#e74c3c');
            svg.appendChild(startCircle);

            container.appendChild(svg);
        }

        function attachEvents() {
            document.querySelectorAll('.editable-input').forEach(inp => {
                inp.addEventListener('input', (e) => {
                    const sidx = parseInt(e.target.dataset.sidx);
                    const segidx = parseInt(e.target.dataset.segidx);
                    const field = e.target.dataset.field;
                    parsedData[sidx].segments[segidx][field] = parseFloat(e.target.value) || 0;
                    e.target.classList.add('edited');
                    drawSVG(parsedData[sidx], `svg-area-${sidx}`);
                });
            });
            
            document.querySelectorAll('.station-name-input').forEach(inp => {
                inp.addEventListener('input', (e) => {
                    const sidx = parseInt(e.target.dataset.sidx);
                    parsedData[sidx].stationName = e.target.value;
                });
            });

            document.querySelectorAll('.add-row-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const sidx = parseInt(e.target.dataset.sidx);
                    const segidx = parseInt(e.target.dataset.segidx);
                    parsedData[sidx].segments.splice(segidx + 1, 0, {dx: 1.0, dy: 1.0}); 
                    renderAll();
                });
            });

            document.querySelectorAll('.del-row-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const sidx = parseInt(e.target.dataset.sidx);
                    const segidx = parseInt(e.target.dataset.segidx);
                    if (parsedData[sidx].segments.length > 1) {
                        parsedData[sidx].segments.splice(segidx, 1);
                        renderAll();
                    } else {
                        alert("これ以上削除できません。");
                    }
                });
            });
        }

        btn.addEventListener('click', async () => { 
            unlockAudio();
            const apiKey = apiKeyInput.value.trim(); 
            const files = imageInput.files; 
            
            if(!apiKey) { alert('APIキーを入力してください'); return; } 
            if(files.length === 0) { alert('野帳の画像を選択してください'); return; } 
            
            localStorage.setItem('gemini_api_key_gnss', apiKey); 
            btn.disabled = true; loading.style.display = 'block'; resultArea.style.display = 'none'; 
            
            try { 
                const modelName = await findAvailableModel(apiKey); 
                loadingDetail.innerText = `画像解析中 (${modelName}を使用)...`;

                const genAI = new GoogleGenerativeAI(apiKey);
                const model = genAI.getGenerativeModel({ model: modelName });
                
                const prompt = `
                    あなたは測量データのデジタル化を行うアシスタントです。
                    添付された画像は「ポール横断測量」の野帳です。
                    画像上部には「No.0」などの測点名が書かれています。
                    その下には階段状の図形が描かれており、各段に寸法が記載されています。
                    階段の【上段（水平線の上）】の数値は水平距離（dx）、【下段（垂直線の横または下）】の数値は垂直距離（dy）を表します。
                    
                    【重要ルール】
                    1. 画像の左端から右端に向かって、順番に各段の(dx, dy)の数値を読み取ってください。
                    2. 垂直距離(dy)の数値の横には、必ず「⊕（プラス）」「⊖（マイナス）」または「±0」の符号が書かれています。
                       - 「⊕（プラス）」は標高が下がる（下り）ことを意味します。システム上、dyは【プラス（正の値）】として出力してください。（例: ⊕1m -> 1.0）
                       - 「⊖（マイナス）」は標高が上がる（上り）ことを意味します。システム上、dyは【マイナス（負の値）】として出力してください。（例: ⊖1m -> -1.0）
                       - 「±0」は水平であることを意味します。dyは【0】として出力してください。（例: ±0m -> 0）
                    3. 一番最初の段の水平距離(dx)も重要なデータです。0にせず、画像に書かれている数値を正確に読み取ってください。（水平線がなく縦線のみから始まる場合は dx: 0 としてください）
                    4. 「m」という単位や丸囲みなどの記号は除外して数値のみ抽出してください。
                    5. 複数の画像がアップロードされた場合は、1画像＝1測点として配列に入れてください。
                    
                    出力フォーマット（JSON形式のみ出力。Markdown記法は禁止）:
                    [
                      {
                        "stationName": "No.1",
                        "segments": [
                          {"dx": 1.0, "dy": 1.0},
                          {"dx": 2.0, "dy": 1.0},
                          {"dx": 1.5, "dy": 2.0},
                          {"dx": 2.0, "dy": 0},
                          {"dx": 1.5, "dy": -1.0},
                          {"dx": 2.0, "dy": -1.0}
                        ]
                      }
                    ]
                `;

                const imageParts = await Promise.all([...files].map(fileToGenerativePart));
                const result = await model.generateContent([prompt, ...imageParts]);
                let text = await result.response.text();
                text = text.replace(/```json/g, '').replace(/```/g, '').trim();
                
                parsedData = JSON.parse(text);
                
                renderAll();
                resultArea.style.display = 'block';
                playSound('success');

            } catch (error) {
                console.error(error);
                playSound('error');
                alert('解析に失敗しました。画像の鮮明さを確認するか、再度お試しください。\n詳細: ' + error.message);
            } finally {
                btn.disabled = false; loading.style.display = 'none';
            }
        });

        // DXFエクスポート機能（縮尺対応）
        btnDxf.addEventListener('click', () => {
            if(parsedData.length === 0) return;
            
            const scale = parseFloat(exportScaleInput.value) || 100;
            const multiplier = 1000 / scale;
            
            let dxf = `0\nSECTION\n2\nENTITIES\n`;
            
            let offsetX = 0;
            
            parsedData.forEach((station) => {
                let curX = offsetX;
                let curY = 0; 
                
                const textHeight = 2.0 * (100 / scale); 
                dxf += `0\nTEXT\n8\n0\n10\n${curX * multiplier}\n20\n${(curY + 2) * multiplier}\n40\n${textHeight}\n1\n${station.stationName}\n`;
                
                station.segments.forEach((seg) => {
                    let dx = parseFloat(seg.dx) || 0;
                    let dy = parseFloat(seg.dy) || 0;
                    if(dx === 0 && dy === 0) return;
                    
                    let nextX = curX + dx;
                    let nextY = curY - dy; // 下り(dy>0)はDXFでは-Y方向
                    
                    const outCurX = curX * multiplier;
                    const outCurY = curY * multiplier;
                    const outNextX = nextX * multiplier;
                    const outNextY = nextY * multiplier;
                    
                    dxf += `0\nLINE\n8\n0\n10\n${outCurX}\n20\n${outCurY}\n11\n${outNextX}\n21\n${outNextY}\n`;
                    
                    curX = nextX;
                    curY = nextY;
                });
                
                offsetX += 15; 
            });
            
            dxf += `0\nENDSEC\n0\nEOF\n`;
            
            const blob = new Blob([dxf], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `AI横断_S${scale}_出力.dxf`;
            link.click();
        });

    </script>
</body>
</html>
